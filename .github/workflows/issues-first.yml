---
# yamllint disable rule:line-length
name: issues-first
'on':
  pull_request:
    branches:
      - master
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
permissions:
  issues: read
  pull-requests: read
jobs:
  issues-first:
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    steps:
      - uses: fosghen/issues-first-action@aebbef32f495ce15b81c0658f26c7ca59dba2981
